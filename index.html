<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable=no: 사진 핀치 확대를 막기 위한 설정입니다 (요청사항) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="__THEME_COLOR__" />

    <!-- ⚙️ 아래 __XXX__ 값들은 빌드 시 src/data/wedding.ts 의 meta 로 자동 치환됩니다 (vite.config.ts) -->
    <title>__OG_TITLE__</title>
    <meta name="description" content="__OG_DESCRIPTION__" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph (카카오톡 · 페이스북 등 링크 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__OG_TITLE__" />
    <meta property="og:title" content="__OG_TITLE__" />
    <meta property="og:description" content="__OG_DESCRIPTION__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__OG_TITLE__" />
    <meta name="twitter:description" content="__OG_DESCRIPTION__" />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <link rel="icon" type="image/svg+xml" href="__BASE__favicon.svg" />
    <link rel="apple-touch-icon" href="__BASE__apple-touch-icon.png" />

    <!-- 히어로 사진만 우선 로드 (LCP) -->
    <link rel="preload" as="image" href="__HERO_IMAGE__" fetchpriority="high" />

    <!-- 웹폰트: 렌더링을 막지 않도록 비동기 로드 (인트로가 재생되는 동안 로딩) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Gowun+Batang:wght@400;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Gowun+Batang:wght@400;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 40px 24px; text-align: center">청첩장을 보시려면 JavaScript 를 켜 주세요.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
